name: Publicar web (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE", "assets-src/**", "android/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Generar la web
        run: python3 scripts/build-web.py
      - name: Preparar
        run: mkdir -p _site && cp www/index.html www/images.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
