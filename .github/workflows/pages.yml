name: Publicar web (GitHub Pages)
# Publica la app como web en https://avillar25.github.io/clash-alerter

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE", "assets-src/**", "android/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Generar la web
        run: python3 scripts/build-web.py
      - name: Preparar
        run: |
          mkdir -p _site && cp www/index.html www/images.json _site/
          # Política de seguridad (solo en la web): limita a dónde puede conectarse y qué puede cargar
          python3 - <<'PY'
          p="_site/index.html"; s=open(p,encoding="utf-8").read()
          csp=("default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
               "font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://gist.githubusercontent.com; "
               "manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'")
          meta='<meta http-equiv="Content-Security-Policy" content="'+csp+'">\n<meta name="referrer" content="no-referrer">'
          assert "<head>" in s; s=s.replace("<head>","<head>\n"+meta,1); open(p,"w",encoding="utf-8").write(s)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
