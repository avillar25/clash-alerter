name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Generar la web
        run: python3 scripts/build-web.py

      - name: Copiar la web a Android
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk clash-alerter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clash-alerter-apk
          path: clash-alerter.apk

      - name: Publicar versión para descargar desde el móvil
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Clash Alerter ${{ github.run_number }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: clash-alerter.apk
