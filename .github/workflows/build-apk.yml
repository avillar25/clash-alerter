name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner de GitHub ya trae el SDK de Android instalado (ANDROID_HOME)
      - name: Comprobar SDK de Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Leer versión y cambios
        run: |
          V=$(tr -d ' \n\r' < VERSION)
          echo "VERSION=$V" >> $GITHUB_ENV
          # Notas de esta versión: su apartado de CHANGELOG.md
          awk -v v="## v$V" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notas.md
          cat notas.md

      - name: Instalar dependencias
        run: npm ci

      - name: Generar la web
        run: python3 scripts/build-web.py

      - name: Copiar la web a Android
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk clash-alerter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clash-alerter-apk
          path: clash-alerter.apk

      - name: Sustituir la versión si ya existía (mismo número = mismo cambio)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true

      - name: Publicar versión para descargar desde el móvil
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Clash Alerter v${{ env.VERSION }}
          make_latest: true
          body_path: notas.md
          files: clash-alerter.apk
