<style>
/* Layout: columna central tipo app; cabecera de cuenta con el ayuntamiento, selector Aldea / Base del constructor,
   y debajo tarjetas: trabajadores, en curso, progreso y catálogo. Oro = constructores, morado = laboratorio, azul noche = base del constructor. */
:root{
  --bg:#e9edf2; --surface:#ffffff; --raise:#f4f6f9; --ink:#18212c; --muted:#5d6977; --line:#d6dce4;
  --gold:#c4830f; --gold-ink:#8a5a05; --gold-soft:#fcf0d6;
  --elixir:#8340cf; --elixir-soft:#f1e7fc;
  --night:#2f5fa8; --night-soft:#e2ebf8;
  --ok:#2c8a4a; --ok-soft:#dff2e5; --warn:#b4560a; --warn-soft:#fdead6; --bad:#b4322b;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --surface:#181e27; --raise:#202834; --ink:#e8ecf1; --muted:#97a3b2; --line:#2a3340;
    --gold:#e9ad3c; --gold-ink:#f2c46c; --gold-soft:#36290f;
    --elixir:#b98af0; --elixir-soft:#2c1f3f;
    --night:#7fa8ec; --night-soft:#1b2a44;
    --ok:#5cc47c; --ok-soft:#163021; --warn:#f0a35b; --warn-soft:#382513; --bad:#ef7a72;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#181e27; --raise:#202834; --ink:#e8ecf1; --muted:#97a3b2; --line:#2a3340;
  --gold:#e9ad3c; --gold-ink:#f2c46c; --gold-soft:#36290f;
  --elixir:#b98af0; --elixir-soft:#2c1f3f;
  --night:#7fa8ec; --night-soft:#1b2a44;
  --ok:#5cc47c; --ok-soft:#163021; --warn:#f0a35b; --warn-soft:#382513; --bad:#ef7a72;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(90px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.3px;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.1} h2{font-size:20px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.tab{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px 6px 8px;border-radius:999px;font:700 14px var(--body);cursor:pointer;white-space:nowrap}
.tab.plain{padding:6px 13px}
.wtabs.static .wtab{cursor:default}
.check.sumchk{font-size:12px;font-weight:600;margin:0 0 0 auto;padding:4px 9px;border:1px solid var(--line,rgba(0,0,0,.15));border-radius:8px;white-space:nowrap;align-self:center}
.check.sumchk input{width:15px;height:15px}
.navrow{display:flex;align-items:center;gap:6px}.navrow .tabs{flex:1;min-width:0}
.tab.gear{padding:6px;width:38px;height:38px;justify-content:center;flex:none}
.tab.gear svg{width:22px;height:22px;display:block}
.top .tab.gear{margin-left:auto}
.setnote{margin:0 0 4px;font-size:13px}
.tab img{width:24px;height:24px;object-fit:contain}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* tarjetas */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .th{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.hero .tag{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 6px;font:800 14px var(--body);cursor:pointer}
.seg button img{width:28px;height:28px;object-fit:contain}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"].bb{color:var(--night)}
.vil-title{display:flex;align-items:center;gap:8px}
.vil-title .pill{font:800 11px var(--body);text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink)}
.vil-title .pill.bb{background:var(--night-soft);color:var(--night)}
/* trabajadores */
.workers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wk{border-radius:12px;padding:9px 11px;background:var(--raise);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.wk .k{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.wk .v{font:400 18px var(--display)}
.wk.free{background:var(--ok-soft);border-color:transparent}
.wk.free .v{color:var(--ok)}
.helpers{display:flex;flex-wrap:wrap;gap:8px}
.hp{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:5px 11px 5px 5px;font-size:13px}
.hp img{width:30px;height:30px;object-fit:contain}
.hp b{display:block;font-size:13px}
.hp select.hlvl{display:block;font:inherit;font-size:12px;padding:1px 4px;margin:2px 0;border-radius:6px;border:1px solid var(--line);background:var(--card,transparent);color:inherit}
.miinv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.mii{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:2px 6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--raise)}
.mii img{width:30px;height:30px;object-fit:contain;grid-row:span 2}
.mii .mn{font-size:12px;line-height:1.15}
.mii .mctl{display:flex;align-items:center;gap:6px}
.mii .mctl .btn.icon{min-width:30px;min-height:30px;padding:0}
.mii.zero{opacity:.6}
.micnt{font-size:12px;font-weight:600;color:var(--ok);margin-left:4px}
.micnt.zero{color:var(--muted)}
.mrow.dim{opacity:.55}
details.sub{border:1px dashed var(--line);border-radius:10px;padding:4px 10px;margin:8px 0}
.maxest{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--raise)}
.maxest .k{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.maxest .v{font-family:var(--display);font-size:22px}
.freenow.has{border-color:var(--ok)!important}
.freenow .who{display:flex;flex-wrap:wrap;gap:6px}
.evrow{display:flex;gap:10px;align-items:center;padding:6px 0}
.evrow .ei{font-size:22px}
.sub.maxl{color:var(--accent,var(--gold));font-weight:600}
.wsec{margin-top:10px}
.wsec:first-child{margin-top:0}
.wsech{display:flex;align-items:center;gap:8px;font-weight:700;margin:4px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.wsech img{width:26px;height:26px;object-fit:contain}
.wsech b{margin-left:auto;font-size:13px;color:var(--muted)}
.wtab .wnext{display:block;font-size:11px;font-weight:600;opacity:.85;line-height:1.2}
.hp.locked>img{opacity:.6;filter:grayscale(.7)}
.hp.locked b{opacity:.8}
.hp .small{display:block}
img.gemi{width:12px;height:15px;vertical-align:-2px;margin-left:3px;object-fit:contain}
.nw{white-space:nowrap}
.eqi.locked{opacity:.6}
.eqi.locked .tile img{filter:grayscale(1)}
.eqbtns{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.btn.eqown{font-size:11px;padding:2px 8px;min-height:26px;width:auto}
.chl{margin:8px 0}
.chl ul,.updnotes{margin:4px 0 0 18px;padding:0}
.chl li,.updnotes li{font-size:13px;margin:2px 0}
.chl li.nob{list-style:none;margin-left:-18px;color:var(--muted)}
.wchoose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.wopt{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--raise);font:inherit;color:inherit;cursor:pointer}
.wprev{background:#1d2433;color:#eef2f8;border-radius:12px;padding:8px;width:100%;font-size:10px;line-height:1.3;min-height:92px;box-sizing:border-box}
.wprev .wp-h{font-weight:700;margin-bottom:3px}.wprev .wp-free{background:#3a2a12;color:#f6dfa6;border-radius:6px;padding:2px 5px;margin-bottom:3px}
.wprev .wp-r{display:flex;align-items:center;gap:4px}.wprev .wp-r i{width:6px;height:6px;border-radius:50%;background:#e3a33b;display:inline-block}.wprev .wp-r b{margin-left:auto;color:#f2b632}
.wprev .wp-l{color:#9fb0c8}.wprev .wp-t{font-size:20px;font-weight:700;color:#f2b632}.wprev .wp-n{font-size:11px}
.evrow.now b{color:var(--ok)}
.hp.ready{background:var(--ok-soft);border-color:transparent}
.hp .btn.small{margin-top:4px;padding:3px 9px;font-size:12px;min-height:0}
.hp .clkedit{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;margin-top:4px}
.hp .clkedit label{font-size:12px}.hp .clkedit input{width:70px;padding:3px 6px}
/* mejoras en curso */
.list{display:flex;flex-direction:column;gap:10px}
.up{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:11px;border-radius:14px;background:var(--raise);border:1px solid var(--line);border-left:4px solid var(--gold);align-items:start}
.up.l,.up.p,.up.bl{border-left-color:var(--elixir)}
.up.bb{border-left-color:var(--night)}
.tile{width:56px;height:56px;border-radius:12px;background:var(--surface);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.tile img{width:50px;height:50px;object-fit:contain}
.tile.sm{width:46px;height:46px;border-radius:10px}
.tile.sm img{width:40px;height:40px}
.ph{font:400 20px var(--display);color:var(--muted)}
.up .name{font-weight:900;line-height:1.25}
.lvl{display:inline-flex;align-items:center;gap:4px;font:800 12px var(--body);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.up .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:3px}
.acc-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.cd{font:400 20px var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cd.done{color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold)}
.up.l .bar i,.up.p .bar i,.up.bl .bar i{background:var(--elixir)}
.up.bb .bar i{background:var(--night)}
.nt{font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px}
.nt.ok{background:var(--ok-soft);color:var(--ok)}
.nt.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
@media (max-width:520px){ .up{grid-template-columns:48px 1fr} .up .tile{width:48px;height:48px} .up .tile img{width:42px;height:42px} .up .cd{grid-column:2;text-align:left;order:-1;font-size:18px} }
/* botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:800 13px var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1d1404}
.btn.primary.l{background:var(--elixir);border-color:var(--elixir);color:#fff}
.btn.primary.bb{background:var(--night);border-color:var(--night);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:11px 16px;font-size:15px}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:110px;font:12px ui-monospace,Menlo,Consolas,monospace}
label{font-size:13px;font-weight:800;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>label{flex:1 1 140px}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:700}
.check input{width:auto}
/* progreso */
.prog{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px}
.ring text{font-family:var(--display);fill:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.stat .k{font-size:12px;font-weight:800;color:var(--muted)}
.stat .v{font:400 17px var(--display);font-variant-numeric:tabular-nums}
.costs{display:flex;flex-wrap:wrap;gap:6px 14px}
.cost{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.cost img{width:18px;height:18px;object-fit:contain}
/* catálogo */
.cat-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.cat-filters{grid-template-columns:1fr}}
.group h3{padding:12px 0 6px;color:var(--muted);font-family:var(--body);font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px}
@media (max-width:400px){.items{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--raise);border:1px solid var(--line)}
.item .nm{font-weight:900;line-height:1.2}
.item .sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.item .go{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .t{font:400 15px var(--display);font-variant-numeric:tabular-nums}
.item.locked{opacity:.55}
.prow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--raise);border:1px solid var(--line);border-left:4px solid var(--gold)}
.prow.l,.prow.p,.prow.bl{border-left-color:var(--elixir)} .prow.bb{border-left-color:var(--night)}
.prow .nm{font-weight:900;line-height:1.25}
.prow .sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.okt{color:var(--ok)}
.pbtns,.gobtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.btn.icon{padding:6px 9px;min-width:32px}
.btn:disabled{opacity:.35;cursor:default}
@media (max-width:520px){.prow{grid-template-columns:46px 1fr}.prow .pbtns{grid-column:1/-1}}
.wtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.wtab{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--tab-edge,var(--line));border-bottom-width:3px;background:var(--tab-bg,var(--raise));color:var(--tab-ink,var(--ink));border-radius:12px;padding:6px 8px;cursor:pointer;font-family:var(--btn-font,var(--body));font-weight:var(--btn-weight,800);font-size:14px;min-width:0}
.wtab img,.wtab .ph{width:32px;height:32px;object-fit:contain;flex:0 0 auto}
.wtab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtab b{font-family:var(--body);font-weight:900;font-size:12px;background:rgba(0,0,0,.18);border-radius:999px;padding:1px 7px}
.wtab[aria-selected="true"]{background:var(--tab-on-bg,var(--ink));color:var(--tab-on-ink,var(--surface));border-color:var(--tab-on-edge,var(--ink))}
.wtab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:560px){.wtab{flex-direction:column;gap:2px;font-size:13px;padding:6px 4px}.wtab span{white-space:normal;text-align:center;line-height:1.1}}
.accchip{display:inline-flex;align-items:center;gap:5px;background:var(--ac);color:#fff;border-radius:999px;padding:2px 9px 2px 3px;font:900 12px var(--body);letter-spacing:.2px}
.accchip img,.accchip .ph{width:20px;height:20px;object-fit:contain;background:rgba(255,255,255,.25);border-radius:50%}
.accchip i{font-style:normal;opacity:.8;font-weight:800}
.up.withacc{border-left-color:var(--ac)!important;border-left-width:6px}
.up.withacc .tile{box-shadow:0 0 0 3px var(--ac)}
.acc-card{border-left:6px solid var(--ac)!important}
.tab.acc{box-shadow:inset 0 -3px 0 var(--ac)}
.nt.soft{background:var(--raise);color:var(--muted);border:1px solid var(--line)}
img.bi{width:20px;height:20px;object-fit:contain;flex:0 0 auto}
.fopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fopt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:14px;border:1px solid var(--tab-edge,var(--line));border-bottom-width:4px;background:var(--raise);color:var(--ink);cursor:pointer;font-family:var(--btn-font,var(--body));font-weight:var(--btn-weight,800);font-size:14px;text-align:center}
.fopt img,.fopt .ph{width:52px;height:52px;object-fit:contain}
.fopt:hover{border-color:var(--gold)}
.fopt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hrow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--raise);border:1px solid var(--line)}
.hrow .nm{font-weight:900} .hrow .sub{font-size:12px;color:var(--muted)}
.how{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.how.used{color:var(--gold-ink);background:var(--gold-soft);border-color:transparent}
.boosts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.boost{flex-direction:row;align-items:center;gap:6px;font-weight:800;font-size:13px}
.boost select{width:auto;padding:5px 8px;font-weight:800}
.bbar{display:flex;flex-wrap:wrap;gap:6px}
.btn.bst{font-size:13px}
.bprev{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;padding:6px;border-radius:12px;background:var(--raise);border:1px solid var(--line)}
.btn.gob.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.gobtag{display:inline-flex;align-items:center;gap:4px;color:var(--ok)}
.gobwk .k{display:flex;align-items:center;gap:5px}
.gobpick{background:var(--ok-soft);border-radius:10px;padding:8px 10px}
.igroup{border-radius:14px;background:var(--raise);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.ihead{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center}
.ihead .nm{font-weight:900;line-height:1.2} .ihead .sub{font-size:12px;color:var(--muted)}
.wood .ihead .nm{font-family:var(--display);font-weight:400;font-size:16px}
.ilevels{display:flex;flex-direction:column;gap:4px}
.ilvl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.ilvl.locked{opacity:.55}
.lvtxt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.lvtxt .lvl{margin-left:0}
.cnt{font-size:12px}
.lvinfo{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lvinfo .t{font:400 14px var(--display);font-variant-numeric:tabular-nums}
@media (max-width:440px){.ilvl{grid-template-columns:1fr auto}.ilvl .gobtns{grid-column:1/-1;justify-content:flex-end}}
.actb{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:4px 10px}
.occbar{border-radius:12px;padding:10px;background:var(--warn-soft);display:flex;flex-direction:column;gap:8px}
.occbar.allbusy{background:var(--ok-soft)}
.occhead{font-weight:800;color:var(--warn)} .occbar.allbusy .occhead{color:var(--ok)}
.occs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.occ{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.occ .k{font-size:12px;font-weight:800;color:var(--muted)}
.occ .v{font:400 20px var(--display)}
.occ.has .v{color:var(--warn)} .occ.full .v{color:var(--ok)}
.occ .ok{font-size:12px;font-weight:800;color:var(--ok)}
.occ .who{display:flex;flex-wrap:wrap;gap:4px}
.linkchip{border:0;cursor:pointer}
.lvl.sc{background:var(--elixir-soft);border-color:var(--elixir);color:var(--elixir)}
.cats{display:flex;flex-direction:column;gap:5px}
.catrow{display:grid;grid-template-columns:130px 1fr 42px;gap:8px;align-items:center;font-size:13px;font-weight:800}
.cb{height:9px;border-radius:5px;background:var(--line);overflow:hidden}.cb i{display:block;height:100%;border-radius:5px}
.cp{text-align:right}
details.loot{border:1px dashed var(--line);border-radius:12px;padding:8px 10px}
details.loot summary{font-family:var(--btn-font,var(--body));font-size:15px}
.lsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}

    const ready=Math.max(now, sl_[bi].free, dep), start=sleepAdjust(ready, sl);
    idle+=start-ready;
    const dur=effDur(acc,p.id,p.from), end=start+dur;
    sl_[bi].free=end; last=Math.max(last,end);
    (avail[p.id+":"+(p.from+1)]=avail[p.id+":"+(p.from+1)]||[]).push(end);
    rows.push({p, w:c.w, slot:bi+1, start, end, dur, wait:start-ready});
  }
  return {rows, last, idle};
}
/* 6: propone un orden de mejoras. Primero lo que más pesa en ataque y en el progreso
   (laboratorio, consejo heroico, herrería, castillo, campamentos, héroes), luego lo nuevo y las
   defensas, después trampas y recursos, y el ayuntamiento al final. Dentro de cada grupo, lo más atrasado primero. */
const PRIO_ID = {1000007:0, 1000071:0, 1000070:0, 1000014:0, 1000000:0, 1000068:0, 1000105:1, 1000039:1, 1000046:0, 1000001:9, 1000034:9};
const PRIO_G = {h_her:0.5, bb_her:0.5, h_arm:1, bb_arm:1, h_def:2, bb_def:2, h_grd:2, h_trp:3, bb_trp:3, h_wrk:3, bb_wrk:3, h_res:4, bb_res:4,
  h_trp2:0, h_spl:0, h_sie:1, h_pet:0, bb_trp2:0};
function suggestPlan(acc, vil, now){
  const keep={catNew:S.catNew, catQ:S.catQ, catAll:S.catAll}; S.catNew=false; S.catQ=""; S.catAll=false;
  let items; try{ items=catalogItems(acc,vil); } finally { Object.assign(S,keep); }
  const lim=hallLevel(acc,vil), inPlan=new Set((acc.plan||[]).map(p=>p.id+":"+p.from));
  const seen=new Set(), byW={};
  for(const x of items){
    const c=CAT[x.id]; if(!c||x.lock||c.g.endsWith("_wal")) continue;
    const key=x.id+":"+x.from; if(seen.has(key)||inPlan.has(key)) continue; seen.add(key);
    const m=maxAt(x.id,lim)||1, behind=x.isNew?1:(m-x.from)/m;
    const prio=(x.id in PRIO_ID)?PRIO_ID[x.id]:(x.isNew&&!c.g.endsWith("_res")?1.5:(PRIO_G[c.g]??3));
    (byW[c.w]=byW[c.w]||[]).push({id:x.id, from:x.from, prio, behind, d:effDur(acc,x.id,x.from)});
  }
  const per={b:2, l:3, p:2, bb:2, bl:3}, out=[];
  for(const w of VIL[vil].workers){
    const cap=(acc.cap||{})[w]||0; if(!cap||!byW[w]) continue;
    const have=(acc.plan||[]).filter(p=>CAT[p.id]&&CAT[p.id].w===w).length;
    const n=Math.max(0, per[w]*cap - have); if(!n) continue;
    byW[w].sort((a,b)=>a.prio-b.prio || b.behind-a.behind || b.d-a.d);
    out.push(...byW[w].slice(0,n).map(x=>({k:rid(), id:x.id, from:x.from})));
  }
  return out;
}
function planFrom(acc, id, from, cnt){
  let f=from;
  for(let guard=0; guard<200; guard++){
    const k=(acc.plan||[]).filter(p=>p.id===id&&p.from===f).length + (acc.ups||[]).filter(u=>u.id===id&&u.from===f).length*0;
    if(k < Math.max(1,cnt)) return f;

  }

}

/* La misma cuenta cambiada en los dos dispositivos: se parte de la versión más nueva y se le
   suman las mejoras que se empezaron, terminaron o cancelaron en la otra. Así no se pierde nada. */
function mergeAcc(a, b){
  const [n,o]=((b._mt||0)>(a._mt||0))?[b,a]:[a,b];
  const out=JSON.parse(JSON.stringify(n)); out.inv=out.inv||{}; out.ups=out.ups||[];
  const og=o.gone||{}, ng=n.gone||{};
  // 1) Lo que la otra terminó, canceló o quitó al importar, y en esta sigue en curso
  for(const up of [...out.ups]){
    const g=og[up.u]; if(!g || ng[up.u]) continue;
    out.ups=out.ups.filter(x=>x.u!==up.u);
    if(g.k==="c"){ if(up.from>0) addInv(out.inv,up.id,up.from,1); }
    else if(g.k==="f"){
      addInv(out.inv,up.id,up.to,1);
      if(up.id===ID_TH) out.th=Math.max(out.th||0,up.to); if(up.id===ID_BH) out.bh=Math.max(out.bh||0,up.to);
      out.done=[{id:up.id,to:up.to,end:g.end||up.end,m:g.m||"time",u:up.u}, ...(out.done||[])].slice(0,20);
    }
  }
  // 2) Lo que solo se empezó en la otra
  const have=new Set(out.ups.map(u=>u.u));
  for(const up of (o.ups||[])){
    if(!up.u || have.has(up.u) || ng[up.u] || og[up.u]) continue;
    // datos de versiones anteriores sin registro: si ya figura como terminada aquí, no se vuelve a poner
    if((n.done||[]).some(d=>d.u===up.u || (!d.u && d.id===up.id && d.to===up.to))) continue;
    out.ups.push(up); if(up.from>0) addInv(out.inv,up.id,up.from,-1);

}
function syncMerge(local, remote){
  const del={...(remote[SYNC_DEL]||{}), ...(local[SYNC_DEL]||{})};
  for(const [k,v] of Object.entries(remote[SYNC_DEL]||{})) del[k]=Math.max(v, del[k]||0);
  const out={}, keys=new Set([...Object.keys(local),...Object.keys(remote)]);
  for(const k of keys){
    if(k===SYNC_DEL) continue;
    const a=local[k], b=remote[k];
    let w = a===undefined ? b : b===undefined ? a : ((b&&b._mt||0) > (a&&a._mt||0) ? b : a);
    if(k.startsWith("acc_") && a && b && typeof a==="object" && typeof b==="object" && JSON.stringify(a)!==JSON.stringify(b)) w=mergeAcc(a,b);
    if(w===undefined) continue;
    if(del[k] && del[k] >= ((w&&w._mt)||0)) continue;     // borrado después del último cambio
    out[k]=w;
  }
  // La misma cuenta del juego (mismo tag) creada en los dos dispositivos: se queda la más reciente
  const byTag={};
  for(const [k,v] of Object.entries(out)) if(k.startsWith("acc_")&&v&&v.tag) (byTag[v.tag]=byTag[v.tag]||[]).push(k);
  for(const ks of Object.values(byTag)) if(ks.length>1){
    // "lo último que se tocó": cambio guardado, importación, mejora empezada o terminada
    const act=v=>Math.max(v._mt||0, v.imp||0, ...(v.ups||[]).map(u=>(u.end||0)-(u.dur||0)), ...(v.done||[]).map(d=>Math.min(d.end||0, Date.now())));
    ks.sort((x,y)=>(act(out[y])-act(out[x])) || (x<y?-1:1));
    for(const k of ks.slice(1)){ delete out[k]; del[k]=Date.now(); }
  }
  const cut=Date.now()-60*86400000;                       // los borrados se olvidan a los 60 días
  out[SYNC_DEL]=Object.fromEntries(Object.entries(del).filter(([k,t])=>t>cut));
  return out;
}

function catalogItems(acc, vil){

    for(const [id,c] of Object.entries(CAT)){

      if(!canUpgrade(+id,0)) continue;
      out.push({id:+id,from:0,cnt:0,lock:!!lockInfo(acc,vil,+id,0)});
    }
  } else {
    for(const [id,lv] of Object.entries(inv)){
      const c=CAT[id]; if(!c||vilOf(+id)!==vil) continue;
      for(const [l,cnt] of Object.entries(lv)){
        const from=+l; if(!canUpgrade(+id,from)) continue;
        out.push({id:+id,from,cnt,lock:!!lockInfo(acc,vil,+id,from)});
      }

    const allowed=(MAXC[vil==="bb"?ID_BH:ID_TH]||{})[String(lim)]||{};
    for(const [id,max] of Object.entries(allowed)){

      if(max-owned>0) out.push({id:+id,from:0,cnt:max-owned,lock:false,isNew:true});
    }
    for(const u of acc.ups||[]){
      if(vilOf(u.id)!==vil||!canUpgrade(u.id,u.to)) continue;
      if(out.some(x=>x.id===u.id&&x.from===u.to)) continue;

    }

  return out.filter(x=>(S.catAll||!x.lock) && (!q||CAT[x.id].n.toLowerCase().includes(q)));
}

function wallsHtml(acc, vil){

  const inv=(acc.inv||{})[String(id)]||{}; const lim=hallLevel(acc,vil); if(!lim) return "";
  let m=0; for(let L=1; L<=c.c.length; L++){ if((c.r[L-1]||0)<=lim) m=L; else break; }
  const levels=Object.entries(inv).map(([l,n])=>[+l,n]).filter(([,n])=>n>0).sort((a,b)=>b[0]-a[0]);
  const total=levels.reduce((s,[,n])=>s+n,0); if(!total) return "";
  const done=levels.filter(([l])=>l>=m).reduce((s,[,n])=>s+n,0);
  let gold=0; levels.forEach(([l,n])=>{ for(let x=l; x<m; x++) gold+=catCost(id,x)*n; });
  // como Clash Ninja: solo lo que añade este ayuntamiento, por coste, y los muros que aún no has puesto
  const hall=vil==="bb"?ID_BH:ID_TH, allowN=+(((MAXC[hall]||{})[String(lim)]||{})[String(id)]||total), prevN=+(((MAXC[hall]||{})[String(lim-1)]||{})[String(id)]||0);
  let pm=0; for(let L=1; L<=c.c.length; L++){ if((c.r[L-1]||0)<=lim-1) pm=L; else break; }

  const all=[...levels,...upW].sort((a,b)=>b[0]-a[0]); let idx=0, dn=0, tot=0;
  for(const [l,n] of all) for(let k=0;k<n;k++){ idx++; const base=idx<=prevN?pm:0; tot+=cs(base,m); dn+=cs(base,Math.max(base,Math.min(l,m))); }
  for(let k=idx;k<allowN;k++){ tot+=cs(0,m); }
  const pc=tot?dn/tot:1;
  return `<details class="panel"><summary>Muros · ${Math.floor(pc*100)}%</summary>
    <div class="small">${done} de ${Math.max(total,allowN)} muros al máximo de tu nivel (nivel ${m}).${gold?` Te faltan <span class="cost">${resIcon(c.res||"Gold")}${fmtNum(gold)}</span>${vil==="h"?" en oro o elixir":""}.`:""}</div>

let modalTick=null;

function durInputs(ms){
  let s=Math.round(ms/1000); const d=Math.floor(s/86400); s-=d*86400; const h=Math.floor(s/3600); s-=h*3600; const m=Math.round(s/60);

    <label for="dd">Días<input id="dd" type="number" min="0" value="${d}"></label>
    <label for="dh">Horas<input id="dh" type="number" min="0" max="23" value="${h}"></label>
    <label for="dm">Minutos<input id="dm" type="number" min="0" max="59" value="${m}"></label></div>`;
}
function readDur(){ const v=id=>Math.max(0,parseInt(document.getElementById(id).value||"0",10)||0); return ((v("dd")*24+v("dh"))*60+v("dm"))*60000; }
function openUpModal({id, lvl, title, sub, durMs, worker, onConfirm, confirmLabel, extra=""}){

  const refresh=()=>{ const d=readDur(); document.getElementById("m-end").textContent=d?fmtWhen(Date.now()+d):"—"; };

function findUp(accId,u){ const acc=accounts().find(a=>a._id===accId); return acc?[acc,(acc.ups||[]).find(x=>x.u===u)]:[null,null]; }

if(typeof document!=="undefined" && document.addEventListener){
setInterval(()=>{

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="close-bg"){ if(ev.target===el) closeModal(); return; }
  if(act==="close"){ closeModal(); return; }
  if(act==="view"){ if(el.dataset.vil) S.vil=el.dataset.vil;
    // la rueda abre y cierra los ajustes: al cerrar vuelve a donde estabas
    if(el.dataset.v==="settings"){ if(S.view==="settings"){ S.view=S.prevView||"all"; render(); window.scrollTo(0,0); return; } S.prevView=S.view; }
    S.view=el.dataset.v; S.catQ=""; S.catG=""; S.catNew=false; render(); window.scrollTo(0,0); return; }
  if(act==="uptab"){ S.upTab[el.dataset.k]=el.dataset.w; render(); return; }
  if(act==="catg"){ S.catG=el.dataset.g; S.catQ=""; render(); return; }
  if(act==="vil"){ S.vil=el.dataset.v; S.catQ=""; S.catG=""; S.catNew=false; render(); return; }
  if(act==="padd"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const id=+el.dataset.id, from=planFrom(acc,id,+el.dataset.from,+el.dataset.cnt||1);
    if(from>=CAT[id].d.length||!canUpgrade(id,from)){ toast("Ya está todo planificado hasta el máximo."); return; }
    saveAcc({...acc, plan:[...(acc.plan||[]), {k:rid(), id, from}]}); toast(CAT[id].n+" añadido al plan"); return;
  }
  if(act==="pfill"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const add=suggestPlan(acc,S.vil,Date.now());
    if(!add.length){ toast("No hay nada más que proponer: el plan ya cubre a todos tus trabajadores."); return; }
    saveAcc({...acc, plan:[...(acc.plan||[]), ...add]});
    toastAction(`Añadidas ${add.length} mejoras al plan. Reordénalas con las flechas si quieres.`, "Deshacer", ()=>{ saveAcc(acc); render(); });
    return;
  }
  if(act==="pmove"||act==="pdel"||act==="pclear"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const plan=[...(acc.plan||[])];
    if(act==="pclear"){
      const keep=plan.filter(p=>vilOf(p.id)!==S.vil);
      if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Pulsa otra vez para vaciar"; return; }
      saveAcc({...acc, plan:keep}); return;
    }
    const i=+el.dataset.i;
    if(act==="pdel"){ plan.splice(i,1); saveAcc({...acc, plan}); return; }
    // mover dentro de la misma aldea
    const d=+el.dataset.d; let j=i+d;
    while(j>=0&&j<plan.length&&vilOf(plan[j].id)!==vilOf(plan[i].id)) j+=d;
    if(j<0||j>=plan.length) return;
    [plan[i],plan[j]]=[plan[j],plan[i]]; saveAcc({...acc, plan}); return;
  }
  if(act==="avedit"){ S.avEdit=el.dataset.acc?el.dataset.acc+":"+el.dataset.k:null; render(); if(S.avEdit){ const i=document.getElementById("av-"+el.dataset.acc+"-"+el.dataset.k); if(i) i.focus(); } return; }
  if(act==="avready"||act==="avset"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const k=el.dataset.k, now=Date.now(), name=k==="clock"?"Torre del reloj":(HELPERS[k]||"Ayudante");
    let at=now-1000;
    if(act==="avset"){
      const i=document.getElementById("av-"+acc._id+"-"+k), h=parseHHMM(i&&i.value, k==="clock"?CLOCK_CD_H:23);
      if(!(h>0)){ toast("Pon cuánto le falta, por ejemplo 05:30."); return; }
      at=now+Math.round(h*3600000);
    }
    S.avEdit=null;
    if(k==="clock") saveAcc({...acc, clock:at});
    else { const hs={...(acc.helpers||{})}, h={...(hs[k]||{lvl:1})}; h.end=at; if(act==="avready") delete h.on; hs[k]=h; saveAcc({...acc, helpers:hs}); }
    toast(act==="avready"?`${name}: disponible.`:`${name}: disponible ${fmtWhen(at)}.`);
    return;
  }
  if(act==="gobswap"){ gobSwap(el.dataset.acc, el.dataset.u); return; }
  if(act==="start"){
    // Se empieza al momento con el tiempo del juego; si hace falta, se cambia luego con "Ajustar tiempo"
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const id=+el.dataset.id, from=+el.dataset.from, c=CAT[id], now=Date.now();
    const b=busy(acc,now), cap=(acc.cap||{})[c.w]||1;
    const full=(b[c.w]||0)>=cap, canGob=GOBLIN[c.w]&&vilOf(id)==="h"&&!goblinUp(acc,c.w,now);
    const go=(useGob)=>{
      const r=startUpgrade(acc,id,from,effDur(acc,id,from),now,undefined,useGob);
      saveAcc(r.acc);
      let msg=`${c.n} empezada · acaba ${fmtWhen(r.up.end)}`;
      if(r.up.boosted) msg+=` (con ${BOOSTS[r.up.boosted[0]].name.toLowerCase()})`;
      if(useGob){ msg+=` · con el ${GOBLIN[c.w].toLowerCase()}`; toastAction(msg, "Era un constructor", ()=>gobSwap(acc._id, r.up.u)); return; }
      toastAction(msg, "Cambiar tiempo", ()=>{ const b2=document.querySelector(`[data-act=adjust][data-u="${r.up.u}"]`); if(b2) b2.click(); });
    };
    if(full){
      // Todos ocupados: no se deja empezar nada más (salvo con el duende, pagando gemas en el juego)
      // Todos ocupados: si el duende está libre se usa; si no, no se deja empezar
      if(canGob){ go(true); return; }
      const nf=nextFree(acc,c.w,now), OCC={b:"todos los constructores están ocupados", bb:"todos los constructores están ocupados", l:"el laboratorio está ocupado", bl:"el laboratorio estelar está ocupado", p:"la casa de mascotas está ocupada"};
      const g=GOBLIN[c.w]&&vilOf(id)==="h"?` y el ${GOBLIN[c.w].toLowerCase()} también`:"";
      toast(`No puedes empezar ${c.n}: ${OCC[c.w]||"no hay trabajadores libres"}${g}.${nf&&nf.at?` El primero queda libre ${fmtWhen(nf.at)}.`:""}`);
      return;
    }
    go(false);
    return;
  }
  if(act==="adjust"){
    const [acc,up]=findUp(el.dataset.acc, el.dataset.u); if(!acc||!up) return;
    openUpModal({id:up.id, lvl:up.to, title:"Ajustar "+CAT[up.id].n, sub:"Pon el tiempo que queda según el juego, por ejemplo tras usar una poción o el aprendiz.", durMs:Math.max(0,up.end-Date.now()),

  if(act==="syncoff"){ SYNC.cfg=null; syncCfgSave(); render(); toast("Sincronización desconectada en este dispositivo. Tus datos se quedan aquí."); return; }
  if(act==="wadd"){
    const prevL=`<div class="wprev big"><div class="wp-h">Clash Alerter</div><div class="wp-free">1 constructor libre</div><div class="wp-r"><i></i>Torre Tesla<b>3:20</b></div><div class="wp-r"><i style="background:#5fa8e0"></i>Bruja nocturna<b>5:02</b></div><div class="wp-r"><i></i>Laboratorio<b>1 d 4 h</b></div></div>`;
    const prevS=`<div class="wprev"><div class="wp-l">Próxima mejora</div><div class="wp-t">3:20</div><div class="wp-n">Torre Tesla</div><div class="wp-l">Principal</div></div>`;
    document.getElementById("modal-root").innerHTML=`<div class="modal-back" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="w-title">
      <h2 id="w-title">¿Qué widget quieres?</h2>
      <div class="wchoose">
        <button class="wopt" data-act="wpin" data-size="large">${prevL}<b>Grande</b><span class="small muted">4×2 · próximas 3 mejoras, libres y ayudantes</span></button>
        <button class="wopt" data-act="wpin" data-size="small">${prevS}<b>Pequeño</b><span class="small muted">2×2 · la próxima mejora</span></button>
      </div>
      <div class="actions"><button class="btn big" data-act="close">Cancelar</button></div>
    </div></div>`;
    return;
  }
  if(act==="wpin"){
    const size=el.dataset.size, W=widgetPlugin(), how="Mantén pulsado un hueco de la pantalla de inicio → Widgets → Clash Alerter, y arrastra el "+(size==="small"?"pequeño":"grande")+".";
    closeModal();
    if(!W){ toast(how); return; }
    widgetSync().then(()=>W.pin({size})).then(r=>{ if(!r||!r.value) toast(how); else toast("Confirma en la ventana de Android para colocarlo."); }).catch(()=>toast("Tu móvil no deja añadirlo desde la app. "+how));
    return;
  }
  if(act==="cancel"){
    const [acc,up]=findUp(el.dataset.acc, el.dataset.u); if(!acc||!up) return;
    const del=null;
    document.getElementById("modal-root").innerHTML=`<div class="modal-back" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="c-title">
      <div class="mhead"><div class="tile">${img(up.id,up.to)}</div><h2 id="c-title">Cancelar ${esc(CAT[up.id].n)}</h2></div>
      <div>Se quita de la lista y vuelve al nivel ${up.from}.${del?" También se borra el aviso programado en ntfy (se abre una pestaña).":""}</div>
      <div class="actions">${del?`<a class="btn danger big" href="${esc(del)}" target="_blank" rel="noopener" data-act="docancel" data-acc="${esc(acc._id)}" data-u="${esc(up.u)}">Cancelar y borrar aviso</a>`:`<button class="btn danger big" data-act="docancel" data-acc="${esc(acc._id)}" data-u="${esc(up.u)}">Cancelar mejora</button>`}<button class="btn big" data-act="close">Volver</button></div>
    </div></div>`;
    return;
  }
  if(act==="boost" && el.dataset.k==="clock"){
    // Torre del reloj: se aplica al momento con la duración de su nivel, sin preguntar
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const now=Date.now();
    const go=()=>{
      const min=clockMinutes(acc), r=applyBoost(acc,"clock",now,{min});   // la torre es gratis: no gasta inventario
      r.acc.clock=now+min*60000+CLOCK_CD_H*3600000;
      saveAcc(r.acc);
      toastAction(`Torre del reloj (${min} min) aplicada a ${r.changed.length} mejora${r.changed.length===1?"":"s"}. Vuelve a estar lista ${fmtWhen(r.acc.clock)}.`, "Deshacer", ()=>{ saveAcc(acc); render(); toast("Torre del reloj deshecha"); });
    };
    if(acc.clock>now) toastAction("La torre del reloj se está recargando: lista "+fmtWhen(acc.clock)+".", "Usar con gemas", go);
    else go();
    return;
  }
  if(act==="boost"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const k=el.dataset.k, B=BOOSTS[k], now=Date.now();
    const ups=(acc.ups||[]).filter(u=>u.end>now&&B.ws.includes(u.w)).sort((a,b)=>a.end-b.end);
    const hl=B.helper?(((acc.helpers||{})[B.helper]||{}).lvl||0):0;
    const hmax=B.helper?Math.max(helperMax(B.helper,acc.th),hl,1):0;
    document.getElementById("modal-root").innerHTML=`<div class="modal-back" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="b-title">
      <div class="mhead"><div class="tile">${img(B.icon,0)}</div><div><h2 id="b-title">${esc(B.name)}</h2><div class="muted small">${esc(B.desc)}</div></div></div>
      ${B.one?`<label for="b-target">Mejora<select id="b-target">${ups.map(u=>`<option value="${esc(u.u)}">${esc(CAT[u.id].n)} ${u.from}→${u.to} · quedan ${fmtDur(u.end-now)}</option>`).join("")}</select></label>
        <label class="check" for="b-until"><input id="b-until" type="checkbox"> Asignarlo hasta que acabe la mejora (trabaja 1 h cada día, como en el juego)</label>
        ${hl?`<input type="hidden" id="b-lvl" value="${hl}"><div class="small">${B.helper===93000000?"Aprendiz":"Ayudante"} a <b>nivel ${hl}</b>: ahorra ${hl} h por hora (cámbialo en Ayudantes si no es así)</div>`:`<label for="b-lvl">Nivel del ${B.helper===93000000?"aprendiz":"ayudante"} (ahorra tantas horas como su nivel; se guarda para la próxima)<select id="b-lvl">${Array.from({length:hmax},(_,i)=>i+1).map(l=>`<option value="${l}" ${l===hmax?"selected":""}>Nivel ${l}</option>`).join("")}</select></label>`}`:""}
      ${B.clock?`<label for="b-min">Minutos de impulso que quedan (si ya lo activaste hace un rato en el juego, pon los que le quedan)<input id="b-min" type="number" min="1" max="120" value="${clockMinutes(acc)}"></label>
        <label for="b-cd">Se puede volver a usar dentro de (horas)<input id="b-cd" type="number" min="0.5" max="48" step="0.5" value="${acc.clockCdH||7}"></label>`:""}
      <div id="b-prev" class="list"></div>
      <div class="actions"><button class="btn primary big ${B.ws[0]==="l"||B.ws[0]==="p"?"l":(B.ws[0]==="bb"?"bb":"")}" data-act="doboost" data-k="${k}" data-acc="${esc(acc._id)}">Aplicar</button><button class="btn big" data-act="close">Cerrar</button></div>
    </div></div>`;
    const prev=()=>{
      const opts={target:(document.getElementById("b-target")||{}).value, lvl:+((document.getElementById("b-lvl")||{}).value||0)||undefined, min:+((document.getElementById("b-min")||{}).value||0)||undefined, until:!!(document.getElementById("b-until")||{}).checked};
      const r=applyBoost(acc,k,Date.now(),opts);
      document.getElementById("b-prev").innerHTML=r.changed.length?r.changed.map(c=>{ const u=acc.ups.find(x=>x.u===c.u); return `<div class="bprev"><div class="tile sm">${img(u.id,u.to)}</div><div><b>${esc(CAT[u.id].n)}</b><div class="small muted">${fmtDur(c.before)} → <b>${fmtDur(c.after)}</b> · acaba <b>${fmtDur(c.before-c.after)} antes</b>${c.windows?"":` (avanza ${fmtDur(Math.min(c.before,c.before-c.after+boostWin(k,opts)))} en ${fmtDur(Math.min(c.after,boostWin(k,opts)))})`}${c.windows?` · ${c.windows} día${c.windows>1?"s":""} de ayuda`:""}</div></div></div>`; }).join(""):`<div class="empty">No hay mejoras en curso a las que aplicarlo.</div>`;
    };
    prev(); document.querySelectorAll("#modal-root select,#modal-root input").forEach(i=>i.addEventListener("input",prev));
    return;
  }
  if(act==="doboost"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const k=el.dataset.k;
    const opts={target:(document.getElementById("b-target")||{}).value, lvl:+((document.getElementById("b-lvl")||{}).value||0)||undefined, min:+((document.getElementById("b-min")||{}).value||0)||undefined, until:!!(document.getElementById("b-until")||{}).checked};
    const now=Date.now(); const r=applyBoost(acc,k,now,opts);
    if(k==="clock"){
      // la torre se recarga: cuenta atrás hasta poder usarla otra vez (y aviso en la app del móvil)
      const cd=Math.max(0.5,+((document.getElementById("b-cd")||{}).value||7)||7);
      r.acc.clock=now+cd*3600000; r.acc.clockCdH=cd;
    } else if(!r.changed.length){ closeModal(); return; }
    saveAcc(useItem(r.acc,k)); closeModal();
    toast(BOOSTS[k].name+" aplicado a "+r.changed.length+" mejora"+(r.changed.length===1?"":"s")+(k==="clock"?". Podrás volver a usarla "+fmtWhen(r.acc.clock)+".":"."));
    return;
  }
  if(act==="eqown"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const id=el.dataset.id, v=el.dataset.v==="1", eq={...(acc.eq||{})}; if(v&&!eq[id]) eq[id]=1;
    saveAcc({...acc, eq, eqOwn:{...(acc.eqOwn||{}), [id]:v}}); toast(EQ[id].n+(v?": lo tienes":": marcado como bloqueado")); return;
  }
  if(act==="equp"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const id=el.dataset.id; const eq={...(acc.eq||{})}; eq[id]=(eq[id]||1)+1;
    saveAcc({...acc, eq}); toast(EQ[id].n+" a nivel "+eq[id]); return;
  }
  if(act==="wallup"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const id=+el.dataset.id, l=+el.dataset.l, have=((acc.inv||{})[String(id)]||{})[String(l)]||0;
    const n=Math.max(1,Math.min(have, parseInt((document.getElementById("wn-"+l+"-"+acc._id)||{}).value,10)||1));
    const inv=JSON.parse(JSON.stringify(acc.inv||{})); addInv(inv,id,l,-n); addInv(inv,id,l+1,n);
    saveAcc({...acc, inv}); toast(n+" muro"+(n>1?"s":"")+" a nivel "+(l+1)); return;
  }
  if(act==="updcheck"){ checkUpdate(true); return; }
  if(act==="updget"){
    if(!UPD.url) return;
    if(P.Browser) P.Browser.open({url:UPD.url}); else window.open(UPD.url,"_system");
    return;
  }
  if(act==="nperm"){ (async()=>{ try{ const p=await P.LocalNotifications.requestPermissions(); NOTIF.perm=p.display; }catch(e){} render(); syncNotifications(); })(); return; }
  if(act==="nexact"){ (async()=>{ try{ await P.LocalNotifications.changeExactNotificationSetting(); const x=await P.LocalNotifications.checkExactNotificationSetting(); NOTIF.exact=x.exact_alarm; }catch(e){} render(); })(); return; }
  if(act==="ntest"){ testNotification(); return; }
  if(act==="bkcopy"){
    const txt=backupJson();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Datos copiados. Pégalos en la otra versión.")).catch(()=>{ const ta=document.getElementById("bk-in"); ta.value=txt; ta.select(); toast("Cópialo tú del cuadro de texto."); });
    return;
  }
  if(act==="bkrestore"){
    const raw=(document.getElementById("bk-in").value||"").trim(); if(!raw){ toast("Pega primero la copia."); return; }
    try{ restoreBackup(raw); S.view="all"; toast("Datos restaurados"); }catch(e){ toast(e.message.startsWith("No es")?e.message:"La copia no es válida."); }
    return;
  }
  if(act==="mi"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const k=el.dataset.k, mi={...(acc.mi||{})}; mi[k]=Math.max(0,(+mi[k]||0)+(+el.dataset.d));
    saveAcc({...acc, mi}); return;
  }
  if(act==="hammer"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const id=+el.dataset.id, from=+el.dataset.from, k=hammerFor(id); if(!k) return;
    const f=FINISH[k], d=effDur(acc,id,from);
    document.getElementById("modal-root").innerHTML=`<div class="modal-back" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="h-title">
      <div class="mhead"><div class="tile">${img(f[1],0)}</div><div><h2 id="h-title">${esc(f[0])}</h2><div class="muted small">${esc(CAT[id].n)} ${esc(stepTxt(id,from))} al instante · ahorras ${fmtDur(d)}</div></div></div>
      <div class="actions"><button class="btn primary big" data-act="dohammer" data-k="${k}" data-acc="${esc(acc._id)}" data-id="${id}" data-from="${from}">Usar martillo</button><button class="btn big" data-act="close">Cancelar</button></div>
    </div></div>`;
    return;
  }
  if(act==="dohammer"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const id=+el.dataset.id, from=+el.dataset.from;
    saveAcc(useItem(hammerUpgrade(acc,id,from,el.dataset.k,Date.now()), el.dataset.k)); closeModal();
    toast(CAT[id].n+" a nivel "+(from+1)+" con "+FINISH[el.dataset.k][0].toLowerCase()); return;
  }
  if(act==="finish"){
    const [acc,up]=findUp(el.dataset.acc, el.dataset.u); if(!acc||!up) return;
    const opts=finishOptions(up), left=Math.max(0,up.end-Date.now());
    document.getElementById("modal-root").innerHTML=`<div class="modal-back" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="f-title">
      <div class="mhead"><div class="tile">${img(up.id,up.to)}</div><div><h2 id="f-title">Terminar ${esc(CAT[up.id].n)}</h2><div class="muted small">Nivel ${up.from} → ${up.to} · quedaban ${fmtDur(left)}</div></div></div>
      <div class="small">¿Cómo la has terminado?</div>
      <div class="fopts">${opts.map(k=>{ const h=miHave(acc,k); return `<button class="fopt" data-act="dofinish" data-m="${k}" data-acc="${esc(acc._id)}" data-u="${esc(up.u)}">${img(FINISH[k][1],0)}<span>${esc(FINISH[k][0])}${h!==null&&k!=="gems"?`<small class="muted"> · tienes ${h}</small>`:""}</span></button>`; }).join("")}</div>
      ${vilOf(up.id)==="bb"?`<div class="small muted">En la base del constructor los libros no sirven, solo gemas.</div>`:""}
      <div class="actions"><button class="btn big" data-act="close">Volver</button></div>
    </div></div>`;
    return;
  }
  if(act==="dofinish"){
    const [acc,up]=findUp(el.dataset.acc, el.dataset.u); if(!acc||!up) return;
    const al=((S.docs.alerts||{}).items||{})[up.u+":end"];
    saveAcc(useItem(finishUpgrade(acc, up.u, el.dataset.m, Date.now()), el.dataset.m)); closeModal();
    toast(CAT[up.id].n+" terminada con "+FINISH[el.dataset.m][0].toLowerCase()+(al?". El aviso que tenía programado puede llegarte igualmente.":""));
    return;
  }
  if(act==="docancel"){
    const [acc]=findUp(el.dataset.acc, el.dataset.u); if(!acc) return;
    saveAcc(cancelUpgrade(acc, el.dataset.u)); closeModal(); toast("Mejora cancelada"); return;
  }
  if(act==="addacc"){
    const name=(document.getElementById("new-name").value||"").trim()||("Cuenta "+(accounts().length+1));
    const raw=document.getElementById("new-json").value.trim();
    let parsed=null;
    if(raw){ try{ parsed=parseExport(JSON.parse(raw)); }catch(e){ toast(e.message.startsWith("No parece")?e.message:"El JSON no es válido. Cópialo de nuevo desde el juego."); return; } }
    const same=parsed&&parsed.tag&&accounts().find(a=>a.tag===parsed.tag);
    if(same){ saveAcc(mergeImport(same, parsed)); S.view=same._id; toast("Esa cuenta ya existía: la he actualizado"); return; }
    let acc={name, order:Date.now(), inv:{}, ups:[], done:[], cap:{b:5,l:1,p:1,bb:1,bl:1}, gp:{b:0,l:0}, th:0, bh:0, tag:""};
    if(parsed) acc=mergeImport(acc, parsed);
    const id="acc_"+rid(); S.view=id; S.vil="h"; save(id, acc); syncIndex(); checkDone(); return;
  }
  if(act==="import"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const raw=document.getElementById("imp-"+acc._id).value.trim(); if(!raw){ toast("Pega primero el JSON."); return; }
    try{ const m=mergeImport(acc, parseExport(JSON.parse(raw))); saveAcc(m); toast("Cuenta actualizada: "+m.ups.length+" mejoras en curso"); setTimeout(checkDone,50); }
    catch(e){ toast(e.message.startsWith("No parece")?e.message:"El JSON no es válido. Cópialo de nuevo desde el juego."); }
    return;
  }
  if(act==="saveacc"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    const v=id=>document.getElementById(id+"-"+acc._id).value;
    const n={...acc, name:(v("name").trim()||acc.name), cap:{...acc.cap, b:Math.max(1,+v("capb")||1), bb:Math.max(0,+v("capbb")||0)}, capManual:true};
    saveAcc(n); toast("Ajustes guardados"); return;
  }
  if(act==="delacc"){
    const acc=accounts().find(a=>a._id===el.dataset.acc); if(!acc) return;
    if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Pulsa otra vez para eliminar"; return; }
    S.view="all"; save(acc._id, null); syncIndex(); toast("Cuenta eliminada"); return;
  }
  if(act==="savetopic"){
    const num=(id,d)=>{ const v=parseInt(document.getElementById(id).value,10); return isNaN(v)?d:v; };
    const sleep={from:parseHHMM((document.getElementById("slfrom")||{}).value, 0), to:parseHHMM((document.getElementById("slto")||{}).value, 8)};
    save("settings", {...settings(), idleOn:document.getElementById("idleon").checked, evOn:(document.getElementById("evon")||{checked:settings().evOn!==false}).checked, idleH:Math.min(24,Math.max(1,num("idleh",2))), sleep}); toast("Ajustes de avisos guardados"); return;
  }
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="cat-q"){ S.catQ=el.value; render(); return; }
  if(el.classList&&el.classList.contains("hhmm")){ fmtHHMMInput(el); return; }
  if(el.id==="gh-token"){ S.tokDraft=el.value; return; }
  if(el.id==="idleh"){ const d=el.value.replace(/\D/g,"").slice(0,2); el.value=d&&+d>24?"24":d; }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.classList && t.classList.contains("sumlist")){ save("settings", {...settings(), sumList:t.checked}); toast(t.checked?"El Resumen mostrará las mejoras en curso.":"El Resumen ya no muestra las mejoras en curso."); return; }
  if(t.dataset && t.dataset.boost){
    const acc=accounts().find(a=>a._id===t.dataset.acc); if(!acc) return;
    saveAcc({...acc, gp:{...(acc.gp||{}), [t.dataset.boost]:+t.value}});
    toast("Tiempos recalculados con "+(+t.value)+" % menos de "+(t.dataset.boost==="b"||t.dataset.boost==="bb"?"construcción":"investigación")); return;
  }
  if(t.dataset && t.dataset.hlvl){
    const acc=accounts().find(a=>a._id===t.dataset.acc); if(!acc) return;
    const id=t.dataset.hlvl, old=(acc.helpers||{})[id]||{end:0};
    saveAcc({...acc, helpers:{...(acc.helpers||{}), [id]:{...old, lvl:+t.value}}});
    toast(+t.value?HELPERS[id]+" a nivel "+t.value:HELPERS[id]+" marcado como bloqueado"); return;
  }
  if(t.id==="cat-new"){ S.catNew=t.checked; S.catG=""; render(); }
  if(t.id==="cat-all"){ S.catAll=t.checked; render(); }
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closeModal(); });
}
if(typeof module!=="undefined"){ module.exports={parseExport,mergeImport,applyDone,startUpgrade,cancelUpgrade,ntfyLink,catDur,effDur,CAT,busy,goblinUp,hammerFor,hammerUpgrade,magicAdvice,stepTxt,eqMax,maxAt,applyBoost,boostedLeft,finishUpgrade,finishOptions,progress,nextFree,maxAt,simulatePlan,sleepAdjust,planFrom,takeIdle,idleLink,unlockHeroes,lockInfo,catalogItems,suggestPlan,gameEvents,plannedNotifications,useItem,S}; }
else {
  fetch("images.json").then(r=>r.ok?r.json():null).then(j=>{ if(j){ IMG=j; render(); } }).catch(()=>{});
  initStore();
}
</script>
</body>
</html>
